<div id="root"></div>
<script>
// Review-only mockup: all state is local; no desktop commands or API calls.
const paths={menu:'M4 6h16M4 12h16M4 18h16',close:'m6 6 12 12M6 18 18 6',monitor:'M3 4h18v13H3zM8 21h8M12 17v4',keyboard:'M2 5h20v14H2zM6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M10 13h.01M14 13h.01M18 13h.01M7 16h10',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z',volume:'m11 4-6 5H2v6h3l6 5zM15 8c3 2 3 6 0 8M18 5c5 4 5 10 0 14',sun:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1 1M18 18l1 1M5 19l1-1M18 6l1-1',chevron:'m9 5 7 7-7 7',down:'m6 9 6 6 6-6',back:'m14 5-7 7 7 7M7 12h14',layout:'M3 3h8v18H3zM15 3h6v8h-6zM15 15h6v6h-6z',connection:'M8 7a4 4 0 0 1 8 0v4M8 17a4 4 0 0 0 8 0v-4M5 10h14v4H5z',logout:'M10 4H4v16h6M10 12h11m-4-4 4 4-4 4',fullscreen:'M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5',mouse:'M12 3a6 6 0 0 0-6 6v6a6 6 0 0 0 12 0V9a6 6 0 0 0-6-6ZM12 3v7M6 10h12',cursor:'m5 3 14 11-7 1-4 6z',arrow:'M12 4v16M5 11l7-7 7 7',delete:'m8 5-7 7 7 7h14V5ZM12 9l6 6M12 15l6-6',return:'M20 5v9H4m5-5-5 5 5 5',smile:'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20ZM8 8h.01M16 8h.01M7 14c2 4 8 4 10 0',clipboard:'M8 5H4v17h16V5h-4M8 2h8v6H8z',battery:'M2 7h17v10H2zM22 10v4M5 10h10v4H5z',wifi:'M3 8c5-5 13-5 18 0M6 12c3-3 9-3 12 0M9 16c2-2 4-2 6 0M12 20h.01',help:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18ZM9 9c0-4 7-4 6 0 0 2-3 2-3 5M12 17h.01'};
const icon=(name,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.monitor}"/></svg>`;
const key=(label,cls='')=>`<button type="button" class="key ${cls}" tabindex="-1">${label}</button>`;
function keyboard(fn=false,clip=false){return `<div class="keyboard"><div class="tools"><div class="toolgroup"><button aria-label="More keys">${icon('layout')}</button><button data-action="fn" class="fn ${fn?'active-tool':''}" aria-label="Function keys">Fn</button><button aria-label="Emoji">${icon('smile')}</button></div><div class="toolgroup">${fn?`<button data-action="clipboard" class="${clip?'active-tool':''}" aria-label="Clipboard">${icon('clipboard')}</button>`:`<button data-action="settings" aria-label="Keyboard and trackpad settings">${icon('settings')}</button>`}<button aria-label="Hide keyboard">${icon('down')}</button></div></div><div class="suggest"><span>the</span><span>you</span><span>and</span></div><div class="keyrow modifiers">${['Esc','Ctrl','Alt','Super','←','↑','↓','→'].map(x=>key(x)).join('')}</div><div class="keyrow numbers">${clip?clipboardActions():fn?Array.from({length:12},(_,i)=>key('F'+(i+1))).join(''):'1234567890'.split('').map(x=>key(x)).join('')}</div><div class="keyrow">${'qwertyuiop'.split('').map(x=>key(x)).join('')}</div><div class="keyrow indent">${'asdfghjkl'.split('').map(x=>key(x)).join('')}</div><div class="keyrow">${key(icon('arrow'),'alt')}${'zxcvbnm'.split('').map(x=>key(x)).join('')}${key(icon('delete'),'alt')}</div><div class="keyrow">${key('?123','alt')}${key('Tab','alt')}${key(',')}${key('space · hold to move cursor','space')}${key('.')}${key(icon('return'),'enter')}</div></div>`}
function status(){return '<div class="statusbar"><span>9:41</span><div class="system">'+icon('wifi')+icon('battery')+'</div></div>'}
function topbar(offline=false,desktop=false){return `<header class="topbar"><button class="icon-btn" data-action="menu" aria-label="Open menu">${icon('menu')}</button><div><div class="title">PC remote</div><div class="subtitle"><span class="dot ${offline?'off':''}"></span>My PC · ${offline?'Disconnected':'Connected'}</div></div>${desktop?`<button class="icon-btn quiet" aria-label="Enter fullscreen">${icon('fullscreen')}</button>`:'<span class="quiet"></span>'}</header>`}
function workspace(offline=false,inset=false){return `${inset?'<div class="section-title">Trackpad</div>':''}<div class="pad">${offline?`<div class="offline-message">${icon('monitor','large')}<h3>Waiting for your PC</h3><p>The remote will be ready<br>when your PC reconnects.</p><span class="pill"><span class="dot off"></span>Reconnecting automatically</span></div>`:`<div class="pad-label">${icon('mouse','large')}<div>Move. Tap. Scroll.</div><small>One finger to point · two to scroll</small></div><div class="cursor">${icon('cursor')}</div><div class="pad-bottom">Tap with two fingers to right-click</div>`}</div><div class="preview">${offline?'<span>Keyboard ready when connected</span>':'<strong>Let’s make this easier<span class="caret"></span></strong><span class="mini-status"><span class="dot"></span>Text preview</span>'}</div>${keyboard()}`}
function phone({variant='a',offline=false,menu=false,settings=false}={}){return `<div class="device ${variant==='b'?'inset':''} ${offline?'offline':''}">${status()}<div class="app">${settings?settingsPanel():topbar(offline)+workspace(offline,variant==='b')}</div><div class="homebar"></div>${menu?drawer():''}</div>`}
function slider(label,value,type){return `<div class="control"><label class="control-head">${icon(type)}${label}<output>${value}%</output></label><input class="range" aria-label="${label}" type="range" value="${value}" min="0" max="100"><button class="output" type="button"><span>${type==='volume'?'PC · Default output':'Main display'}</span>${icon('down')}</button></div>`}
function nav(name,symbol,active=false){return `<button class="nav-item ${active?'active':''}" data-action="${active?'remote':'section'}">${icon(symbol)}<span>${name}</span>${!active?icon('chevron','chevron'):''}</button>`}
function menuContents(desktop=false){return `<div class="drawer-head"><div class="brand">ottoman<span style="color:#a6bdf3">.</span></div><button data-action="close-menu" aria-label="Close menu">${icon(desktop?'menu':'close')}</button></div>${nav('PC remote','mouse',true)}<div class="section-label">Quick controls</div>${slider('Volume',42,'volume')}${slider('Brightness',75,'sun')}<div class="section-label">Desktop</div>${nav('Displays','monitor')}${nav('Audio outputs','volume')}${nav('Display layouts','layout')}<button class="layout-select" style="width:100%"><span>Current layout · Desk</span>${icon('down')}</button><div class="drawer-foot"><div class="subtitle"><span class="dot"></span>My PC is connected</div>${nav('Connection','connection')}${nav('Log out','logout')}</div>`}
function drawer(){return `<div class="scrim" data-action="close-menu"></div><aside class="drawer" aria-label="Desktop controls">${menuContents()}</aside>`}
function toggleRow(label,checked=true,help=''){return `<div class="setting-row"><span>${label}${help?`<span class="helper">${help}</span>`:''}</span><button class="toggle ${checked?'':'off'}" role="switch" aria-label="${label}" aria-checked="${checked}"></button></div>`}
function valueRow(label,value){return `<div class="setting-row"><span>${label}</span><button class="value">${value}${icon('chevron')}</button></div>`}
function settingsPanel(){return `<header class="settings-head"><button class="icon-btn" data-action="back" aria-label="Back to remote">${icon('back')}</button><div><h2>Input settings</h2><div class="subtitle">Keyboard & trackpad</div></div></header><div class="settings-body"><div class="tabs" role="tablist" aria-label="Input settings"><button class="selected" role="tab" aria-selected="true" data-tab="keyboard">Keyboard</button><button role="tab" aria-selected="false" data-tab="trackpad">Trackpad</button></div><div class="keyboard-settings"><div class="setting-list">${valueRow('Keyboard','Ottoman')}${valueRow('Layout','British (UK)')}${valueRow('Appearance','Dark')}</div><div class="setting-group">Typing</div><div class="setting-list">${toggleRow('Swipe typing')}${toggleRow('Autocorrect',false)}${toggleRow('Double-space period')}${toggleRow('Key haptics')}</div><div class="setting-group">Text preview</div><div class="setting-list">${toggleRow('Mirror focused text',false,'Show the active text field. Passwords stay hidden.')}${toggleRow('Terminal scrollback',false)}${valueRow('Terminal font','Iosevka Term')}</div><details class="advanced"><summary>Key layout & suggestions</summary><p>Number row · Taller keys · Symbol hints · Punctuation keys · Tab position · Suggestions</p></details><details class="advanced"><summary>Advanced gestures & timing</summary><p>Preview interaction · Preview navigation · Space cursor sensitivity · Symbol hold · Repeat timing · Adaptive key sizes</p></details></div><div class="trackpad-settings"><div class="setting-group">Pointer & scrolling</div><div class="setting-list">${['Cursor sensitivity','Cursor friction','Scroll sensitivity','Scroll friction'].map((label,i)=>`<label class="setting-row"><span>${label}</span><input aria-label="${label}" type="range" value="${i%2?80:40}"></label>`).join('')}</div><div class="setting-group">Audio</div><div class="setting-list">${toggleRow('Volume keys control output',true,'Use volume keys for the selected audio output.')}</div></div></div>`}
function desktop(){return `<div class="desktop"><aside class="sidebar">${menuContents(true)}</aside><div class="app">${topbar(false,true)}<div class="workspace">${workspace()}</div></div></div>`}

function clipboardActions(){return `<button class="key clip-action" data-action="paste-image">Paste image</button><button class="key clip-action" data-action="paste-phone">Paste from iPhone</button><button class="key clip-action" data-action="copy-pc">Copy from PC</button>`}
function clipboardPreview(){return `<section class="clip-inline" role="dialog" aria-label="PC clipboard"><header><span>PC clipboard · Text</span><button data-action="close-preview" aria-label="Close preview">${icon('close')}</button></header><p class="sample">Booking reference: OTT-2048<br>Table for two · Friday, 7:30 pm</p><button class="copy" data-action="clipboard-success">Copy to iPhone</button><p class="clip-note">Replaces your iPhone clipboard when you tap Copy.</p></section>`}
function clipboardPhone(copy=false){let html=phone();html=html.replace(keyboard(),keyboard(true,true));if(copy)html=html.replace('<div class="pad-bottom">',clipboardPreview()+'<div class="pad-bottom" hidden>');return html}
const root=document.querySelector('#root');const query=new URLSearchParams(location.search);const view=query.get('view')||'options';
if(view==='options')root.innerHTML=`<main class="board"><div class="board-head"><div><div class="eyebrow">Ottoman / Remote first</div><h1>One remote. Two directions.</h1></div><small>Mobile concepts · 390 × 760<br>Same keyboard, gestures and desktop controls.</small></div><div class="columns"><section><div class="label">A / Quiet canvas <span class="tag">Recommended</span></div>${phone()}<p class="caption">More room for the trackpad. Keyboard anchored below. One menu for everything else.</p></section><section><div class="label">B / Soft workspace</div>${phone({variant:'b'})}<p class="caption">Inset panels separate pointing, text preview and typing. A little more structure, a little less pad space.</p></section></div></main>`;
else if(view==='states')root.innerHTML=`<main class="board"><div class="board-head"><div><div class="eyebrow">A / Quiet canvas</div><h1>The rest stays out of the way.</h1></div><small>Controls when needed.<br>A familiar surface when disconnected.</small></div><div class="columns three"><section><div class="label">01 / Menu open</div>${phone({menu:true})}</section><section><div class="label">02 / Disconnected</div>${phone({offline:true})}</section><section><div class="label">03 / Input settings</div>${phone({settings:true})}</section></div></main>`;
else if(view==='clipboard')root.innerHTML=`<main class="board"><div class="board-head"><div><div class="eyebrow">A / Clipboard in Fn</div><h1>Same row. Three useful actions.</h1></div><small>Fn → Clipboard replaces the F-key row.<br>No new toolbar, no extra keyboard height.</small></div><div class="columns"><section><div class="label">01 / Choose a direction</div>${clipboardPhone()}<p class="caption">Paste image · Paste from iPhone · Copy from PC.<br>Tap Clipboard again to return to F1–F12.</p></section><section><div class="label">02 / Copy from PC</div>${clipboardPhone(true)}<p class="caption">Fetch a preview only on request. Tap Copy to iPhone to finish. The keyboard stays exactly where it was.</p></section></div></main>`;
else if(view==='desktop')root.innerHTML=`<main class="board"><div class="board-head"><div><div class="eyebrow">A / Responsive desktop</div><h1>The same home, with room to breathe.</h1></div><small>Menu becomes a collapsible sidebar.<br>Trackpad and keyboard stay together.</small></div>${desktop()}</main>`;
else{document.body.className='prototype';const selected=query.get('variant')||'a';function draw(){root.innerHTML=innerWidth>=900?desktop():phone({variant:selected,offline:query.has('offline')});root.insertAdjacentHTML('beforeend','<div class="review-only"><select aria-label="Review variant"><option value="a">Design A</option><option value="b">Design B</option></select></div>');root.querySelector('select').value=selected;root.querySelector('select').onchange=e=>location.search='view=prototype&variant='+e.target.value}draw();let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(draw,120)})}
root.addEventListener('input',e=>{if(e.target.matches('.range'))e.target.closest('.control').querySelector('output').textContent=e.target.value+'%'});
root.addEventListener('click',e=>{const toggle=e.target.closest('.toggle');if(toggle){const checked=toggle.getAttribute('aria-checked')==='true';toggle.setAttribute('aria-checked',String(!checked));toggle.classList.toggle('off',checked)}const tab=e.target.closest('[data-tab]');if(tab){const scope=tab.closest('.settings-body');scope.querySelectorAll('[data-tab]').forEach(x=>{x.classList.toggle('selected',x===tab);x.setAttribute('aria-selected',String(x===tab))});scope.querySelector('.keyboard-settings').style.display=tab.dataset.tab==='keyboard'?'block':'none';scope.querySelector('.trackpad-settings').style.display=tab.dataset.tab==='trackpad'?'block':'none'}const action=e.target.closest('[data-action]');if(!action)return;const device=action.closest('.device,.desktop');if(!device)return;if(action.dataset.action==='menu'&&!device.querySelector('.drawer')){if(device.classList.contains('desktop')){device.querySelector('.sidebar').hidden=!device.querySelector('.sidebar').hidden}else device.insertAdjacentHTML('beforeend',drawer())}if(action.dataset.action==='close-menu'||action.dataset.action==='remote'){device.querySelectorAll('.drawer,.scrim').forEach(x=>x.remove());if(device.classList.contains('desktop')&&action.dataset.action==='close-menu')device.querySelector('.sidebar').hidden=true}if(action.dataset.action==='fn'){const k=device.querySelector('.keyboard');const active=k.dataset.fn!=='true';k.outerHTML=keyboard(active,false);device.querySelector('.keyboard').dataset.fn=String(active)}if(action.dataset.action==='clipboard'){const k=device.querySelector('.keyboard');const active=k.dataset.clip!=='true'&&!k.querySelector('.clip-action');k.outerHTML=keyboard(true,active);device.querySelector('.keyboard').dataset.fn='true';device.querySelector('.keyboard').dataset.clip=String(active)}if(action.dataset.action==='copy-pc'){if(!device.querySelector('.clip-inline'))device.querySelector('.pad').insertAdjacentHTML('beforeend',clipboardPreview())}if(action.dataset.action==='close-preview'){device.querySelector('.clip-inline')?.remove()}if(['clipboard-success','paste-phone','paste-image'].includes(action.dataset.action)){const preview=device.querySelector('.preview');preview.innerHTML='<span class="clipboard-feedback">Design preview · nothing was sent or copied.</span>'}if(action.dataset.action==='settings'){device.querySelector('.app').innerHTML=settingsPanel()}if(action.dataset.action==='back'){device.querySelector('.app').innerHTML=topbar(device.classList.contains('offline'))+`<div class="${device.classList.contains('desktop')?'workspace':'app'}">${workspace(device.classList.contains('offline'),device.classList.contains('inset'))}</div>`}});
</script>
</html>
